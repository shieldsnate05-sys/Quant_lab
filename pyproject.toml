[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-lab"
version = "0.1.0"
description = "Quant-Lab: a professional quantitative research platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "alpaca-py>=0.43",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "scipy>=1.12",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]

[tool.setuptools.packages.find]
include = [
    "config*",
    "core*",
    "data*",
    "indicators*",
    "features*",
    "strategies*",
    "backtesting*",
    "optimization*",
    "ml*",
    "reports*",
    "visualization*",
    "utils*",
]
exclude = ["tests*", "notebooks*", "logs*", "temp*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = [
    "config",
    "core",
    "data",
    "indicators",
    "features",
    "strategies",
    "backtesting",
    "optimization",
    "ml",
    "reports",
    "visualization",
    "utils",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = [
    "config",
    "core",
    "data",
    "indicators",
    "features",
    "strategies",
    "backtesting",
    "optimization",
    "ml",
    "reports",
    "visualization",
    "utils",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["alpaca.*", "xgboost.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
